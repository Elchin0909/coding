plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// Spring Boot 3.3.4 o'zining BOM'ida Testcontainers 1.19.8 ni majburlaydi.
// Docker Engine 29 eski Docker API (<1.44) ni rad etgani uchun yangiroq kerak.
ext['testcontainers.version'] = '1.21.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // ===== ASOSIY (senda bor) =====
    implementation 'org.springframework.boot:spring-boot-starter-web'          // REST API, controller
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'     // baza, Hibernate, repository
    implementation 'org.springframework.boot:spring-boot-starter-security'     // xavfsizlik, JWT filter
    implementation 'org.springframework.boot:spring-boot-starter-validation'   // @Valid, @NotBlank
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'   // Redis (blacklist)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'   // Swagger

    // ===== JWT =====
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ===== BAZA drayveri =====
    runtimeOnly 'org.postgresql:postgresql'

    // ===== MONITORING (keyingi etap: Actuator + metrikalar) =====
    implementation 'org.springframework.boot:spring-boot-starter-actuator'     // ilova salomatligi, metrikalar

    // ===== MAPPER (keyingi etap: entity <-> DTO avtomatik) =====
    implementation 'org.mapstruct:mapstruct:1.6.2'                             // qo'lda mapping o'rniga
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'

    // ===== LOMBOK (ixtiyoriy: getter/setter/constructor avtomatik) =====
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // ===== TESTLAR (hozirgi etap) =====
    testImplementation 'org.springframework.boot:spring-boot-starter-test'     // JUnit 5, Mockito, AssertJ
    testImplementation 'org.springframework.security:spring-security-test'     // security test
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Gradle 9 uchun majburiy
    // ===== TESTCONTAINERS =====
    // Versiya yuqoridagi ext['testcontainers.version'] dan olinadi.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'


}

tasks.named('test') {
    useJUnitPlatform()

    // Docker Engine 29 minimal API versiyasi = 1.44, docker-java esa
    // sukut bo'yicha 1.32 so'raydi va daemon 400 qaytaradi.
    // Shuning uchun versiyani aniq belgilaymiz.
    systemProperty 'api.version', '1.44'

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'short'
    }
}